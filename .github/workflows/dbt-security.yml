name: dbt Security Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f packages.yml ]; then pip install dbt-core; fi

      - name: Run SQLFluff lint (SQL linting)
        run: |
          pip install sqlfluff
          sqlfluff lint models/ || true

      # GitHub secret scanning is enabled by default for public repos
      # For private repos, see GitHub documentation to enable secret scanning
