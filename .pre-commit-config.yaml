repos:

  # dbt-checkpoint: dbt를 위한 각종 검사
  - repo: https://github.com/dbt-checkpoint/dbt-checkpoint
    rev: v1.1.1
    hooks:
      - id: check-source-columns-have-desc # source의 column에 description이 있는지 검사
      - id: check-source-has-all-columns # source에 정의된 모든 column이 model에 포함되어 있는지 검사
      - id: check-model-tags # model에 태그가 있는지 검사
        args: ["--tags", "comparison", "incremental"]
      - id: check-model-has-description # model에 description이 있는지 검사

  # dbt-autofix 추가
  - repo: https://github.com/dbt-labs/dbt-autofix
    rev: v0.14.0
    hooks:
      - id: dbt-autofix-fix
        args: [--behavior-change]  # deprecated 변경 감지

  - repo: local
    hooks:
      - id: dbt-project-evaluator
        name: Run dbt_project_evaluator
        entry: >
          bash -c "dbt build --warn-error --select package:dbt_project_evaluator --no-color 2>&1 | tee /dev/stderr"
        language: system
